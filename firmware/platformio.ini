
[platformio]
default_envs = main

[env:main]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_src_filter =
    +<main.cpp>
    +<dht_manager.cpp>
    +<mmwave_manager.cpp>
    +<oled_manager.cpp>
    +<pzem_manager.cpp>
	+<buzzer_manager.cpp>
	+<wifi_manager.cpp>
	+<cloud_manager.cpp>

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    mathieucarbou/MycilaPZEM
